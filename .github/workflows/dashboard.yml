name: Portfolio dashboard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - name: Test dashboard contract
        run: node --test scripts/dashboard.test.mjs scripts/dashboard-state.test.mjs scripts/dashboard-refresh-health.test.mjs scripts/dashboard-render.test.mjs scripts/evidence-contract.test.mjs scripts/operation-summary.test.mjs scripts/assurance-packet.test.mjs scripts/fetch-release-descriptor.test.mjs scripts/fetch-risk-proofs.test.mjs scripts/render-assurance-packet.test.mjs scripts/github-api.test.mjs
      - name: Validate release assurance risk map
        run: node scripts/validate-risk-map.mjs
      - name: Rebuild the retained operation sample
        run: |
          node scripts/operation-summary.mjs \
            --input portfolio/operation-samples/window-2026-10-22.json \
            --json-out "$RUNNER_TEMP/operation-summary.json" \
            --markdown-out "$RUNNER_TEMP/operation-summary.md"
          cmp "$RUNNER_TEMP/operation-summary.json" portfolio/operation-samples/summary-2026-10-22.json
          cmp "$RUNNER_TEMP/operation-summary.md" docs/operation-cost-decisions-report-2026-10-22.md
      - name: Refresh portfolio evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-dashboard.mjs
      - name: Validate dashboard data
        run: node scripts/validate-dashboard.mjs
      - name: Upload dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-dashboard
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: portfolio-dashboard
          path: site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
