name: Portfolio dashboard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Test dashboard contract
        run: node --test scripts/dashboard.test.mjs
      - name: Refresh portfolio evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-dashboard.mjs
      - name: Validate dashboard data
        run: node scripts/validate-dashboard.mjs
      - name: Upload dashboard
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-dashboard
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: portfolio-dashboard
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v5
