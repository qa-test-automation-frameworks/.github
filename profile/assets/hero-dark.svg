<svg width="1280" height="380" viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QA Test Automation Frameworks — quality engineering, made observable. Five review-ready frameworks: browser UI, API contracts, performance, accessibility, LLM evaluation.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="ekg" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset=".33" stop-color="#38bdf8"/>
      <stop offset=".66" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#141d31" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="52"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
      .blob{animation:drift 16s ease-in-out infinite alternate}
      .b2{animation-duration:21s;animation-delay:-6s}
      .b3{animation-duration:26s;animation-delay:-12s}
      @keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(56px,-26px) scale(1.14)}}
      .comet{stroke-dasharray:130 1900;animation:sweepDash 6.5s linear infinite}
      @keyframes sweepDash{from{stroke-dashoffset:2030}to{stroke-dashoffset:0}}
      .w{animation:wordIn .28s both}
      @keyframes wordIn{from{opacity:0}to{opacity:1}}
      .caret{animation:blink 1.1s step-end infinite 3.4s}
      @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
      .dot{animation:pulse 2.6s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.22}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect width="1280" height="380" fill="url(#bg)"/>
  <g filter="url(#soft)" opacity=".3">
    <ellipse class="blob" cx="240" cy="330" rx="330" ry="150" fill="#10b981"/>
    <ellipse class="blob b2" cx="1010" cy="70" rx="350" ry="160" fill="#3b82f6"/>
    <ellipse class="blob b3" cx="660" cy="360" rx="300" ry="130" fill="#8b5cf6"/>
  </g>
  <rect width="1280" height="380" fill="url(#grid)" opacity=".5"/>

  <!-- observability pulse line -->
  <path id="hb" d="M0 306 H500 L522 306 L536 266 L554 336 L570 288 L586 306 H864 L880 306 L892 282 L904 322 L916 306 H1280" fill="none" stroke="url(#ekg)" stroke-width="1.6" opacity=".18"/>
  <path d="M0 306 H500 L522 306 L536 266 L554 336 L570 288 L586 306 H864 L880 306 L892 282 L904 322 L916 306 H1280" fill="none" stroke="url(#ekg)" stroke-width="2.4" class="comet" filter="url(#glow)" stroke-linecap="round"/>

  <g text-anchor="middle">
    <text x="640" y="102" class="mono" font-size="14" letter-spacing="7" fill="#34d399" font-weight="600">QA TEST AUTOMATION FRAMEWORKS</text>
    <text x="640" y="158" class="sans" font-size="46" font-weight="800" fill="#f1f5f9">Quality engineering, made observable.</text>
    <text x="640" y="198" class="mono" font-size="15.5" fill="#8fa3c0">
      <tspan class="w" style="animation-delay:.7s">five frameworks</tspan><tspan class="w" style="animation-delay:1.15s" fill="#334760"> · </tspan><tspan class="w" style="animation-delay:1.35s">one standard</tspan><tspan class="w" style="animation-delay:1.85s" fill="#334760"> · </tspan><tspan class="w" style="animation-delay:2.1s">every claim linked to </tspan><tspan class="w" style="animation-delay:2.75s" fill="#7dd3fc">running evidence</tspan>
    </text>
    <rect class="caret" x="978" y="185" width="9" height="17" fill="#34d399"/>
  </g>

  <!-- capability chips -->
  <g class="sans" font-size="12.5" font-weight="600">
    <g transform="translate(275,232)">
      <rect width="128" height="34" rx="17" fill="#0d1526" stroke="#1d2b47"/>
      <circle class="dot" cx="20" cy="17" r="4" fill="#34d399"/>
      <text x="74" y="21.5" text-anchor="middle" fill="#c7d2e4">BROWSER UI</text>
    </g>
    <g transform="translate(413,232)">
      <rect width="148" height="34" rx="17" fill="#0d1526" stroke="#1d2b47"/>
      <circle class="dot" style="animation-delay:.4s" cx="20" cy="17" r="4" fill="#38bdf8"/>
      <text x="84" y="21.5" text-anchor="middle" fill="#c7d2e4">API CONTRACTS</text>
    </g>
    <g transform="translate(571,232)">
      <rect width="148" height="34" rx="17" fill="#0d1526" stroke="#1d2b47"/>
      <circle class="dot" style="animation-delay:.8s" cx="20" cy="17" r="4" fill="#fbbf24"/>
      <text x="84" y="21.5" text-anchor="middle" fill="#c7d2e4">PERFORMANCE</text>
    </g>
    <g transform="translate(729,232)">
      <rect width="150" height="34" rx="17" fill="#0d1526" stroke="#1d2b47"/>
      <circle class="dot" style="animation-delay:1.2s" cx="20" cy="17" r="4" fill="#2dd4bf"/>
      <text x="85" y="21.5" text-anchor="middle" fill="#c7d2e4">ACCESSIBILITY</text>
    </g>
    <g transform="translate(889,232)">
      <rect width="116" height="34" rx="17" fill="#0d1526" stroke="#1d2b47"/>
      <circle class="dot" style="animation-delay:1.6s" cx="20" cy="17" r="4" fill="#a78bfa"/>
      <text x="66" y="21.5" text-anchor="middle" fill="#c7d2e4">LLM EVALS</text>
    </g>
  </g>

  <rect x="0" y="376" width="1280" height="4" fill="url(#sweep)"/>
</svg>
