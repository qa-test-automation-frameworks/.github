<svg width="1280" height="270" viewBox="0 0 1280 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Field results from an anonymized platform migration over about one month: suite stability improved from about 40 percent to about 90 percent; full-suite runtime dropped from about 2 hours to about 15 minutes; test mix rebalanced from over 1,000 UI-heavy checks to 40 critical journeys plus API coverage; authoring became about 3 times faster.">
  <defs>
    <style>
      .sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace}
      .bar{transform-box:fill-box;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.7,.3,1) both}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @media (prefers-reduced-motion: reduce){*{animation:none !important}}
    </style>
  </defs>

  <rect x="8" y="8" width="1264" height="254" rx="18" fill="#0b1120" stroke="#1f2b47" stroke-width="1.5"/>
  <text x="44" y="52" class="mono" font-size="13" letter-spacing="4" fill="#64748b" font-weight="600">FIELD RESULTS — ONE PLATFORM MIGRATION, ≈1 MONTH (ANONYMIZED CASE STUDY)</text>

  <!-- column 1: stability -->
  <g transform="translate(60,90)">
    <text y="0" class="mono" font-size="12" letter-spacing="2" fill="#7c8db0">SUITE STABILITY</text>
    <text y="44" class="sans" font-size="30" font-weight="800" fill="#e2e8f0">~40% <tspan fill="#475a77">→</tspan> <tspan fill="#34d399">~90%</tspan></text>
    <rect y="70" width="200" height="8" rx="4" fill="#16213a"/>
    <rect y="70" width="89" height="8" rx="4" fill="#3b4a68"/>
    <rect class="bar" style="animation-delay:.3s" y="92" width="200" height="8" rx="4" fill="#34d399"/>
    <text y="126" class="mono" font-size="11.5" fill="#526480">before → after</text>
  </g>

  <!-- column 2: runtime -->
  <g transform="translate(376,90)">
    <text y="0" class="mono" font-size="12" letter-spacing="2" fill="#7c8db0">FULL-SUITE RUNTIME</text>
    <text y="44" class="sans" font-size="30" font-weight="800" fill="#e2e8f0">~2 h <tspan fill="#475a77">→</tspan> <tspan fill="#34d399">~15 min</tspan></text>
    <rect y="70" width="200" height="8" rx="4" fill="#16213a"/>
    <rect y="70" width="200" height="8" rx="4" fill="#3b4a68"/>
    <rect class="bar" style="animation-delay:.5s" y="92" width="25" height="8" rx="4" fill="#34d399"/>
    <text y="126" class="mono" font-size="11.5" fill="#526480">8× faster feedback</text>
  </g>

  <!-- column 3: test mix -->
  <g transform="translate(692,90)">
    <text y="0" class="mono" font-size="12" letter-spacing="2" fill="#7c8db0">TEST MIX</text>
    <text y="44" class="sans" font-size="30" font-weight="800" fill="#e2e8f0">1,000+ <tspan fill="#475a77">→</tspan> <tspan fill="#38bdf8">40 + API</tspan></text>
    <rect y="70" width="200" height="8" rx="4" fill="#16213a"/>
    <rect y="70" width="200" height="8" rx="4" fill="#3b4a68"/>
    <rect class="bar" style="animation-delay:.7s" y="92" width="46" height="8" rx="4" fill="#38bdf8"/>
    <text y="126" class="mono" font-size="11.5" fill="#526480">UI-heavy checks → critical journeys + API</text>
  </g>

  <!-- column 4: authoring -->
  <g transform="translate(1008,90)">
    <text y="0" class="mono" font-size="12" letter-spacing="2" fill="#7c8db0">AUTHORING SPEED</text>
    <text y="44" class="sans" font-size="30" font-weight="800" fill="#e2e8f0"><tspan fill="#a78bfa">~3×</tspan> faster</text>
    <rect y="70" width="200" height="8" rx="4" fill="#16213a"/>
    <rect y="70" width="66" height="8" rx="4" fill="#3b4a68"/>
    <rect class="bar" style="animation-delay:.9s" y="92" width="200" height="8" rx="4" fill="#a78bfa"/>
    <text y="126" class="mono" font-size="11.5" fill="#526480">fixtures · builders · conventions</text>
  </g>
</svg>
